<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScavyPlay - Live Scavenger Hunt</title>
  <!-- Kode PWA & Full-Screen (Android/iOS) -->
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ScavyPlay">
  <link rel="apple-touch-icon" href="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f4cd.png">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { font-family: sans-serif; margin: 0; padding: 15px; background: #f4f4f9; color: #333; }
    .box { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
    #map { height: 250px; width: 100%; border-radius: 8px; }
    input, button { width: 100%; padding: 12px; margin-top: 10px; box-sizing: border-box; font-size: 16px; border-radius: 6px; }
    input { border: 1px solid #ccc; }
    button { background: #ff5722; color: white; border: none; font-weight: bold; cursor: pointer; }
    button:disabled { background: #ccc; }
    .feed-item { border-bottom: 1px solid #eee; padding: 12px 0; }
    .feed-item img { max-width: 100%; border-radius: 6px; margin-top: 8px; }
    .route-card { background: #e3f2fd; border-left: 5px solid #2196f3; padding: 10px 15px; border-radius: 4px; margin-top: 10px; font-weight: bold; line-height: 1.5; white-space: pre-wrap; }
    #mainApp { display: none; }
  </style>
</head>
<body>

  <h2>🎮 ScavyPlay</h2>

  <!-- SCREEN 1: LOGIN NAMA TIM -->
  <div id="loginScreen" class="box" style="text-align: center; padding: 30px 15px;">
    <h3>Semangat Pagi Peserta Outbound! 👋</h3>
    <p>Masukkan nama grup kalian untuk melihat arahan rute tugas.</p>
    <input type="text" id="inputTeamName" placeholder="Contoh: Tim Alpha">
    <button onclick="loginTeam()">Mulai Petualangan 🚀</button>
  </div>

  <!-- SCREEN 2: APLIKASI UTAMA -->
  <div id="mainApp">
    
    <!-- INFO TIM & RUTE -->
    <div class="box">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h3 id="displayTeamName" style="margin:0; color:#ff5722;">-</h3>
        <small><a href="#" onclick="logoutTeam()" style="color:#999;">Ganti Tim</a></small>
      </div>
      <div id="routeInfo" class="route-card">Memuat rute dari admin...</div>
    </div>

    <!-- PETA LOKASI -->
    <div class="box">
      <h3>1. Titik Tugas (Peta)</h3>
      <div id="map"></div>
    </div>

    <!-- UPLOAD FOTO -->
    <div class="box">
      <h3>2. Upload Bukti Tugas</h3>
      <input type="file" id="photoInput" accept="image/*">
      <button id="uploadBtn" onclick="submitTask()">Kirim Tugas Sekarang!</button>
      <p id="statusMsg" style="font-size: 14px; color: #666; font-weight: bold; margin-top: 8px;"></p>
    </div>

    <!-- LIVE FEED -->
    <div class="box">
      <h3>3. Live Feed</h3>
      <div id="feed">Memuat data...</div>
    </div>

  </div>

  <!-- Firebase & Leaflet SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDXyV5osFDRAPewRUdYxApva5mhksiLwgQ",
      authDomain: "scavyplay.firebaseapp.com",
      projectId: "scavyplay",
      storageBucket: "scavyplay.firebasestorage.app",
      messagingSenderId: "393425670663",
      appId: "1:393425670663:web:22a24d2583c219eb1790a2",
      measurementId: "G-SRVN48V46T"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let currentTeam = "";
    let map;

    window.onload = function() {
      const savedTeam = localStorage.getItem("scavy_team");
      if (savedTeam) initApp(savedTeam);
    };

    function loginTeam() {
      const name = document.getElementById("inputTeamName").value.trim();
      if (!name) return alert("Ketik nama grup dulu bossku!");
      localStorage.setItem("scavy_team", name);
      initApp(name);
    }

    function logoutTeam() {
      if (confirm("Yakin mau keluar/ganti tim?")) {
        localStorage.removeItem("scavy_team");
        location.reload();
      }
    }

    function initApp(teamName) {
      currentTeam = teamName;
      document.getElementById("loginScreen").style.display = "none";
      document.getElementById("mainApp").style.display = "block";
      document.getElementById("displayTeamName").innerText = "🚩 " + teamName;

      // GET RUTE DARI FIRESTORE SECARA REALTIME
      db.collection("routes").doc(teamName.toLowerCase()).onSnapshot((doc) => {
        const routeContainer = document.getElementById("routeInfo");
        if (doc.exists) {
          routeContainer.innerHTML = "📍 <b>ARAHAN RUTE KAMU:</b>\n" + doc.data().routeText;
        } else {
          routeContainer.innerHTML = "📍 <b>RUTE UMUM:</b>\nAdmin belum menentukan rute khusus untuk tim ini. Silakan ikuti arahan Fasilitator di lapangan!";
        }
      });

      if (!map) {
        map = L.map('map').setView([3.5952, 98.6722], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: 'OpenStreetMap' }).addTo(map);
        L.marker([3.5952, 98.6722]).addTo(map).bindPopup("<b>Checkpoint Utama</b>").openPopup();
      }
      
      listenLiveFeed();
    }

    function compressAndConvert(file, maxWidth, quality) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width, height = img.height;
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
            canvas.width = width; canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
        };
      });
    }

    async function submitTask() {
      const fileInput = document.getElementById('photoInput');
      const btn = document.getElementById('uploadBtn');
      const status = document.getElementById('statusMsg');

      if (!fileInput.files[0]) return alert("Pilih foto dulu boss!");

      btn.disabled = true;
      status.innerText = "⏳ Memproses foto...";

      try {
        const base64Image = await compressAndConvert(fileInput.files[0], 600, 0.5);
        status.innerText = "🚀 Mengirim data...";

        await db.collection("submissions").add({
          team: currentTeam,
          photo: base64Image,
          timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });

        alert("Mantap! Tugas berhasil dikirim.");
        fileInput.value = "";
        status.innerText = "✅ Berhasil dikirim!";
      } catch (error) {
        alert("Gagal kirim: " + error.message);
        status.innerText = "❌ Gagal mengunggah.";
      } finally {
        btn.disabled = false;
      }
    }

    function listenLiveFeed() {
      db.collection("submissions").orderBy("timestamp", "desc").onSnapshot((snapshot) => {
        const feedContainer = document.getElementById('feed');
        if (snapshot.empty) {
          feedContainer.innerHTML = "<p>Belum ada yang kirim tugas.</p>";
          return;
        }

        let html = "";
        snapshot.forEach((doc) => {
          const data = doc.data();
          const time = data.timestamp ? new Date(data.timestamp.toDate()).toLocaleTimeString() : "Baru saja";
          html += `
            <div class="feed-item">
              <strong>${data.team}</strong> <small style="color:#888;">(${time})</small><br>
              <img src="${data.photo}" alt="Bukti Foto">
            </div>
          `;
        });
        feedContainer.innerHTML = html;
      });
    }
  </script>
</body>
</html>
