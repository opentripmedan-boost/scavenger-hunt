<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScavyPlay - Live Scavenger Hunt</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { font-family: sans-serif; margin: 0; padding: 15px; background: #f4f4f9; color: #333; }
    .box { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
    #map { height: 300px; width: 100%; border-radius: 8px; }
    input, button { width: 100%; padding: 12px; margin-top: 10px; box-sizing: border-box; font-size: 16px; border-radius: 6px; }
    input { border: 1px solid #ccc; }
    button { background: #ff5722; color: white; border: none; font-weight: bold; cursor: pointer; }
    button:disabled { background: #ccc; }
    .feed-item { border-bottom: 1px solid #eee; padding: 12px 0; }
    .feed-item img { max-width: 100%; border-radius: 6px; margin-top: 8px; }
  </style>
</head>
<body>

  <h2>🎮 ScavyPlay</h2>

  <div class="box">
    <h3>1. Titik Tugas (Peta)</h3>
    <div id="map"></div>
  </div>

  <div class="box">
    <h3>2. Upload Bukti Tugas</h3>
    <input type="text" id="teamName" placeholder="Nama Grup Lu (Contoh: Tim Alpha)">
    <input type="file" id="photoInput" accept="image/*">
    <button id="uploadBtn" onclick="submitTask()">Kirim Tugas Sekarang!</button>
    <p id="statusMsg" style="font-size: 14px; color: #666; font-weight: bold; margin-top: 8px;"></p>
  </div>

  <div class="box">
    <h3>3. Live Feed</h3>
    <div id="feed">Memuat data...</div>
  </div>

  <!-- Firebase & Leaflet SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Config Firebase ScavyPlay
    const firebaseConfig = {
      apiKey: "AIzaSyDXyV5osFDRAPewRUdYxApva5mhksiLwgQ",
      authDomain: "scavyplay.firebaseapp.com",
      projectId: "scavyplay",
      storageBucket: "scavyplay.firebasestorage.app",
      messagingSenderId: "393425670663",
      appId: "1:393425670663:web:22a24d2583c219eb1790a2",
      measurementId: "G-SRVN48V46T"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Inisialisasi Peta (Default Medan)
    const map = L.map('map').setView([3.5952, 98.6722], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: 'OpenStreetMap'
    }).addTo(map);

    L.marker([3.5952, 98.6722]).addTo(map)
      .bindPopup("<b>Checkpoint 1</b><br>Upload foto kegiatan kalian di sini!")
      .openPopup();

    // Fungsi Kompres Foto
    function compressAndConvert(file, maxWidth, quality) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;

            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = (err) => reject(err);
        };
        reader.onerror = (err) => reject(err);
      });
    }

    // Fungsi Kirim Tugas
    async function submitTask() {
      const teamName = document.getElementById('teamName').value.trim();
      const fileInput = document.getElementById('photoInput');
      const btn = document.getElementById('uploadBtn');
      const status = document.getElementById('statusMsg');

      if (!teamName) return alert("Isi nama grup dulu bro!");
      if (!fileInput.files[0]) return alert("Pilih foto dulu bro!");

      btn.disabled = true;
      status.innerText = "⏳ Memproses & mengompres foto...";

      try {
        const file = fileInput.files[0];
        // Kompres gambar otomatis biar muat di database gratisan
        const base64Image = await compressAndConvert(file, 600, 0.5);

        status.innerText = "🚀 Mengirim ke server...";

        await db.collection("submissions").add({
          team: teamName,
          photo: base64Image,
          timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });

        alert("Mantap! Tugas berhasil dikirim.");
        document.getElementById('teamName').value = "";
        fileInput.value = "";
        status.innerText = "✅ Berhasil dikirim!";
      } catch (error) {
        console.error(error);
        alert("Gagal kirim: " + error.message);
        status.innerText = "❌ Gagal mengunggah.";
      } finally {
        btn.disabled = false;
      }
    }

    // Realtime Listener
    db.collection("submissions")
      .orderBy("timestamp", "desc")
      .onSnapshot((snapshot) => {
        const feedContainer = document.getElementById('feed');
        if (snapshot.empty) {
          feedContainer.innerHTML = "<p>Belum ada yang kirim tugas.</p>";
          return;
        }

        let html = "";
        snapshot.forEach((doc) => {
          const data = doc.data();
          const time = data.timestamp ? new Date(data.timestamp.toDate()).toLocaleTimeString() : "Baru saja";
          html += `
            <div class="feed-item">
              <strong>${data.team}</strong> <small style="color:#888;">(${time})</small><br>
              <img src="${data.photo}" alt="Bukti Foto">
            </div>
          `;
        });
        feedContainer.innerHTML = html;
      });
  </script>
</body>
</html>
